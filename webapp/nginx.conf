server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS internal Docker, supaya alamat service di-resolve ulang kalau container dibuat ulang
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api-services:3000;
    set $ws_upstream http://notification-service:3001;

    # /api/v1/... -> api-services /v1/...
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket notifikasi
    location = /ws {
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Asset hasil build punya hash di nama file, aman di-cache lama
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: route yang bukan file diarahkan ke index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
