name: waroenkqu

# Urutan start:
#   postgres, redis, rabbitmq (healthy)
#     -> api-services (migration + seed selesai -> healthy)
#       -> catalog-publisher, notification-service (healthy)
#         -> webapp

x-common-env: &common-env
  TZ: ${TZ}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672

services:
  postgres:
    image: postgres:16-alpine
    environment:
      TZ: ${TZ}
      PGTZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    environment:
      TZ: ${TZ}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api-services:
    build: ./api-services
    environment:
      <<: *common-env
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL}
      CATALOG_PUBLISH_INTERVAL: ${CATALOG_PUBLISH_INTERVAL}
    ports:
      - "${API_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # /health baru OK setelah migration & seed selesai dan server listen
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  catalog-publisher:
    build: ./catalog-publisher
    environment:
      <<: *common-env
      CATALOG_PUBLISH_INTERVAL: ${CATALOG_PUBLISH_INTERVAL}
    depends_on:
      # Schema dibuat oleh migration api-services, jadi harus menunggu api-services healthy
      api-services:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    environment:
      <<: *common-env
      PORT: 3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "${NOTIFICATION_PORT}:3001"
    depends_on:
      # Schema dibuat oleh migration api-services, jadi harus menunggu api-services healthy
      api-services:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  webapp:
    build: ./webapp
    environment:
      TZ: ${TZ}
    ports:
      - "${WEBAPP_PORT}:80"
    depends_on:
      # nginx meneruskan /api ke api-services dan /ws ke notification-service
      api-services:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
