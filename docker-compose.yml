name: waroenkqu

# Dua cara menjalankan (lihat readme "Cara Menjalankan"):
#   1. Image siap pakai dari GHCR: docker compose pull && docker compose up -d
#   2. Build sendiri dari source:  docker compose up -d --build
# Image GHCR dibangun otomatis oleh .github/workflows/publish-images.yml dari branch main.

# Urutan start:
#   postgres, redis, rabbitmq (healthy)
#     -> api-services (migration + seed selesai -> healthy)
#       -> catalog-publisher, notification-service (healthy)
#         -> webapp

# Port di sini adalah port di dalam jaringan Docker (antar container).
# Port untuk akses dari komputer host diatur lewat HOST_*_PORT di .env (bagian "ports").
x-common-env: &common-env
  TZ: ${TZ}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672

services:
  postgres:
    image: postgres:16-alpine
    environment:
      TZ: ${TZ}
      PGTZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${HOST_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    # Di sebagian mesin ARM (misalnya Docker Desktop di Mac Apple Silicon) Redis bisa berhenti saat start
    # karena peringatan ARM64-COW-BUG. Isi Redis hanya salinan katalog yang selalu dibuat ulang, jadi aman diabaikan.
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]
    environment:
      TZ: ${TZ}
    ports:
      - "${HOST_REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    # Tanpa tag "management" supaya image lebih kecil; UI management diaktifkan lewat enabled_plugins
    image: rabbitmq:3.13-alpine
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${HOST_RABBITMQ_PORT}:5672"
      - "${HOST_RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/management.conf:/etc/rabbitmq/conf.d/20-management_agent.disable_metrics_collector.conf:ro
    # Batas file descriptor yang sangat besar (bawaan sebagian Docker Desktop) membuat Erlang lambat start dan boros memori
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Cukup cek port AMQP (baru terbuka setelah RabbitMQ selesai boot). Jangan pakai rabbitmq-diagnostics:
      # CLI itu jalan sebagai root dan bisa membuat .erlang.cookie milik root sebelum RabbitMQ siap,
      # sehingga RabbitMQ gagal start di mesin yang lambat.
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  api-services:
    image: ghcr.io/rombombo/waroenkqu-api-services:latest
    build: ./api-services
    environment:
      <<: *common-env
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL}
      CATALOG_PUBLISH_INTERVAL: ${CATALOG_PUBLISH_INTERVAL}
    ports:
      - "${HOST_API_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # /health baru OK setelah migration & seed selesai dan server listen
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  catalog-publisher:
    image: ghcr.io/rombombo/waroenkqu-catalog-publisher:latest
    build: ./catalog-publisher
    environment:
      <<: *common-env
      CATALOG_PUBLISH_INTERVAL: ${CATALOG_PUBLISH_INTERVAL}
    depends_on:
      # Schema dibuat oleh migration api-services, jadi harus menunggu api-services healthy
      api-services:
        condition: service_healthy

  notification-service:
    image: ghcr.io/rombombo/waroenkqu-notification-service:latest
    build: ./notification-service
    environment:
      <<: *common-env
      PORT: 3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "${HOST_NOTIFICATION_PORT}:3001"
    depends_on:
      # Schema dibuat oleh migration api-services, jadi harus menunggu api-services healthy
      api-services:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  webapp:
    image: ghcr.io/rombombo/waroenkqu-webapp:latest
    build: ./webapp
    environment:
      TZ: ${TZ}
    ports:
      - "${HOST_WEBAPP_PORT}:80"
    depends_on:
      # nginx meneruskan /api ke api-services dan /ws ke notification-service
      api-services:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
